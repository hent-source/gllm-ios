# Описание проекта для XcodeGen.
##
# XcodeGen превращает этот файл в Glim.xcodeproj прямо на раннере GitHub,
# поэтому сам .xcodeproj в репозитории хранить не нужно — и не нужно
# ничего генерировать руками.
#
# Локально, если появится Xcode: brew install xcodegen && xcodegen generate

name: Glim

options:
  bundleIdPrefix: app.glim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # Подпись для сборки на симуляторе не нужна.
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    # Предупреждения Swift 6 как ошибки не делаем — сначала надо,
    # чтобы проект вообще собрался.
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Glim:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: Resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.glim.ios
        PRODUCT_NAME: Glim
        INFOPLIST_KEY_CFBundleDisplayName: Glim
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        GENERATE_INFOPLIST_FILE: "YES"
        # Требование iOS: обращения только по HTTPS.
        # Если сервер работает по http, здесь появится исключение —
        # но лучше поставить на сервер сертификат.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"

schemes:
  Glim:
    build:
      targets:
        Glim: all
    run:
      config: Debug
    archive:
      config: Release
