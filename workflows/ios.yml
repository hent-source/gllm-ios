name: iOS Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Glim.xcodeproj \
            -scheme Glim \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
        continue-on-error: true

      - name: Show errors
        if: always()
        run: |
          echo "=== Ошибки компиляции ==="
          grep -E "error:" build.log | sed 's|/Users/runner/work/[^/]*/[^/]*/||' | sort -u || echo "ошибок нет"
          echo
          echo "=== Предупреждения ==="
          grep -E "warning:" build.log | sed 's|/Users/runner/work/[^/]*/[^/]*/||' | sort -u | head -40 || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      # Сборка .ipa для устройства. Требует платного Apple Developer:
      # сертификат и профиль кладутся в секреты репозитория.
